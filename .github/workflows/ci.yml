name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -c constraints-py310.txt ./MorSTORM-dual ./MorSTORM-B
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s MorSTORM-B/tests -v
      - run: python -m unittest discover -s MorSTORM-dual/tests -v
